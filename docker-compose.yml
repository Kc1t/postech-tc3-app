services:
  api:
    build: .
    container_name: workshop-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - workshop-net
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: workshop-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - workshop-net
    restart: unless-stopped

  mongo-express:
    image: mongo-express:latest
    container_name: workshop-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - workshop-net
    restart: unless-stopped

volumes:
  mongo-data:

networks:
  workshop-net:
    driver: bridge
