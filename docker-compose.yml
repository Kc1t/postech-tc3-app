services:
  api:
    build: .
    container_name: workshop-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      POSTGRES_DSN: postgres://postgres:postgres@postgres:5432/workshop?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - workshop-net
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: workshop-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: workshop
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - workshop-net
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: workshop-pgadmin
    ports:
      - "8082:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@workshop.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - postgres
    networks:
      - workshop-net
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  workshop-net:
    driver: bridge
