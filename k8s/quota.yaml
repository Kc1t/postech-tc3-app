apiVersion: v1
kind: ResourceQuota
metadata:
  name: workshop-api
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "6"
    limits.memory: 6Gi
    pods: "14"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: workshop-api
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "1"
        memory: 1Gi
